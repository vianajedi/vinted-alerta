name: Vinted Alerta

on:
  schedule:
    - cron: "7 * * * *"      # de hora a hora; cada execução fica ligada ~5h45 e a seguinte já fica em fila
  workflow_dispatch:         # botão "Run workflow" para correr à mão

permissions:
  actions: write             # limpar estados antigos e manter o agendamento ativo
  contents: read

concurrency:
  group: vinted-alerta
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      # O código foi carregado como .zip: extrai-o aqui antes de correr
      - name: Extrair código do zip
        run: |
          if [ ! -f requirements.txt ] && ls *.zip >/dev/null 2>&1; then
            unzip -q -o "$(ls *.zip | head -1)" -d _zip
            cp -rn _zip/*/. . 2>/dev/null || cp -rn _zip/. .
            rm -rf _zip
          fi
          ls

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restaurar estado
        uses: actions/cache/restore@v4
        with:
          path: state.enc
          key: vinted-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: vinted-state-

      - name: Verificar favoritos e responder ao bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN || secrets.VINTEDLIKES2026BOT }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VINTED_COOKIE: ${{ secrets.VINTED_COOKIE }}
          VINTED_USER_ID: ${{ secrets.VINTED_USER_ID }}
          VINTED_DOMAIN: ${{ vars.VINTED_DOMAIN || 'www.vinted.pt' }}
          STATE_KEY: ${{ secrets.STATE_KEY || secrets.VINTEDLIKES2026BOT }}  # sem STATE_KEY, usa o token como chave
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          # Fica ligado ~5h45 (limite do GitHub: 6h). O estado é gravado a cada ciclo de 10 min.
          end=$((SECONDS + 20700))
          while [ $SECONDS -lt $end ]; do
            python -m vinted_alerta --once --poll-seconds $(( end - SECONDS < 600 ? end - SECONDS : 600 )) || sleep 30
          done

      - name: Guardar estado
        if: always() && hashFiles('state.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: state.enc
          key: vinted-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Limpar estados antigos e manter o agendamento ativo
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key vinted-state- --sort created_at --order desc --limit 100 --json id --jq '.[10:][].id' \
            | xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY" || true
          # O GitHub desliga agendamentos após 60 dias sem atividade; isto volta a ativá-lo.
          gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/vinted-alerta.yml/enable" >/dev/null || true

      # O agendamento do GitHub é pouco fiável: cada execução lança a seguinte.
      # (Para parar o bot: Actions → Vinted Alerta → ••• → Disable workflow, ou cancelar a execução.)
      - name: Lançar a próxima execução
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run vinted-alerta.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.ref_name }}"
